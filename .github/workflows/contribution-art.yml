name: Generate Snake

# Crta „zmiju" i graf aktivnosti iz kalendara doprinosa i sprema ih na granu `output` (README ih čita
# odande). Vrti se svaku noć u ponoć (UTC) i ručno: Actions → Generate Snake → Run workflow.

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]   # odmah po izmjeni README-a ili skripte; workflow piše na `output`, pa nema petlje

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PRIJE zmije: snk radi u Dockeru kao root i stvori `dist/` koju korak poslije njega ne smije pisati
      - name: Graf aktivnosti (zadnjih 31 dan)
        run: node .github/scripts/activity-graph.mjs leonkreso784-bit dist/activity-graph.svg

      - uses: Platane/snk@v3
        with:
          github_user_name: leonkreso784-bit
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
