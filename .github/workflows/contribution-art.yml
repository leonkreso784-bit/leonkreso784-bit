name: Contribution art

# Crta tetris doprinosa i graf aktivnosti iz kalendara doprinosa i sprema ih na granu `output` (README ih
# čita odande). Vrti se svaku noć u ponoć (UTC) i ručno: Actions → Contribution art → Run workflow.

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]   # odmah po izmjeni README-a ili skripte; workflow piše na `output`, pa nema petlje

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ⚠️ Ako se ikad vrati Docker-akcija (npr. Platane/snk): ona stvori `dist/` kao root, pa naši koraci
      # moraju ići PRIJE nje (12.10.2026. je zbog toga graf pao).
      - name: Graf aktivnosti (zadnjih 31 dan)
        run: node .github/scripts/activity-graph.mjs leonkreso784-bit dist/activity-graph.svg

      - name: Contribution tetris
        run: node .github/scripts/contribution-tetris.mjs leonkreso784-bit dist/github-tetris.svg dist/github-tetris-dark.svg

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
